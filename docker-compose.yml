name: attendhub

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Points at Hong's local native Postgres (see the root .env) — not a
      # containerized database anymore. `host.docker.internal` is Docker
      # Desktop's DNS name for reaching the host machine from a container.
      DATABASE_URL: ${LOCAL_DATABASE_URL}
      JWT_SECRET: local-dev-secret-do-not-use-in-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - /app/backend/node_modules

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Runs in the browser, not server-to-server — must be a host-reachable
      # URL (the backend's published port), not the internal Docker hostname.
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
